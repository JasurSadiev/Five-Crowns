<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0a3b2e" />
    <meta
      name="description"
      content="Five Crowns online - play the eleven round rummy card game with friends in real time. Free, no download, up to seven players."
    />
    <title>Five Crowns - Play together. Outsmart everyone.</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <style>
      /* Pre-paint background so there is never a white flash before React. */
      html { background: #080e1a; }
      html:not(.dark) { background: #f8fafc; }
      #boot {
        position: fixed; inset: 0; display: grid; place-items: center;
        font-family: system-ui, sans-serif; color: #e9b534; gap: 12px;
      }
      #boot .ring {
        width: 42px; height: 42px; border-radius: 999px;
        border: 3px solid rgba(233,181,52,0.25); border-top-color: #e9b534;
        animation: spin 0.9s linear infinite; margin: 0 auto 14px;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="boot">
      <div style="text-align:center">
        <div class="ring"></div>
        <div style="letter-spacing:0.3em;font-size:12px;text-transform:uppercase">Five Crowns</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
